[project]
name = "agentguard"
version = "0.1.0.dev0"
description = "Offline-first security scanner for AI agent skills, instruction files, and MCP servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agent Guard contributors" }]
keywords = ["security", "mcp", "agent-skills", "sast", "llm", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
# Core dependencies are all available under Pyodide. Keep this list short.
dependencies = [
  "pydantic>=2.9,<3",
  "regex>=2024.9.11",
  "pyyaml>=6.0.2,<7",
  "typer>=0.12,<1",
  "rich>=13.7",
]

[project.optional-dependencies]
code = [
  "tree-sitter>=0.23,<1",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-bash>=0.23",
]
yara = ["yara-python>=4.5,<5"]
judge = ["anthropic>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[tool.uv.workspace]
members = ["web"]

[project.scripts]
agentguard = "agentguard.cli.app:main"

[project.urls]
Homepage = "https://github.com/ak2dev/agentguard-v1"
Security = "https://github.com/ak2dev/agentguard-v1/blob/main/SECURITY.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

# The rule pack and mappings are versioned separately from the engine but
# ship inside the wheel so the CLI works offline.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "agentguard/_data/rules"
"mappings" = "agentguard/_data/mappings"
"schemas" = "agentguard/_data/schemas"
"intel" = "agentguard/_data/intel"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
