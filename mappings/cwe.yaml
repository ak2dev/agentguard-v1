framework: cwe
name: Common Weakness Enumeration
version: "4.x"
source: https://cwe.mitre.org/
notes: Titles to be re-checked against the current CWE list during release review.
items:
  - {id: CWE-20, title: Improper Input Validation}
  - {id: CWE-22, title: "Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"}
  - {id: CWE-59, title: "Improper Link Resolution Before File Access ('Link Following')"}
  - {id: CWE-74, title: "Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection')"}
  - {id: CWE-78, title: "Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"}
  - {id: CWE-88, title: "Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"}
  - {id: CWE-89, title: "Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"}
  - {id: CWE-94, title: "Improper Control of Generation of Code ('Code Injection')"}
  - {id: CWE-95, title: "Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"}
  - {id: CWE-250, title: Execution with Unnecessary Privileges}
  - {id: CWE-295, title: Improper Certificate Validation}
