framework: nsa-csi-mcp-2026-05
name: "NSA AISC CSI — Model Context Protocol (MCP): Security Design Considerations for AI-Driven Automation"
version: "2026-05 (U/OO/6030316-26, PP-26-1834, Ver. 1.0)"
source: https://www.nsa.gov/Portals/75/documents/Cybersecurity/CSI_MCP_SECURITY.pdf
notes: >-
  Read from the PDF (17 pages, SHA-256 f9c0452acdf5f45603f61079eea66b67e19b372bee96a8bbb3981a74429add03,
  retrieved 2026-10-02). The CSI does not number its sections, so item ids are slugs of its own
  headings, grouped as it groups them: security concerns, real-world examples, and recommendations.
  A rule maps to an item only where the CSI's text describes the risk the rule detects or the control
  it checks; skill and scanner-internal rules map to nothing ([]) because the CSI covers MCP only.
