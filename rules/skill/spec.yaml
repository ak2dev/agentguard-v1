rules:
  - id: AG-SKL-SPEC-001
    version: 1
    title: Missing or empty required name/description
    description: SKILL.md must start with YAML frontmatter containing non-empty `name` and `description`.
    why: Agents load `name` and `description` at startup to decide when to activate a skill. A skill without them is malformed and cannot be reviewed or matched reliably.
    severity: low
    confidence: high
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Add YAML frontmatter with a `name` (matching the directory) and a `description` of what the skill does and when to use it.
    references: ["https://agentskills.io/specification"]

  - id: AG-SKL-SPEC-002
    version: 1
    title: Skill name violates the naming rules
    description: The `name` must be 1-64 characters of lowercase letters, digits and single hyphens, not starting or ending with a hyphen.
    why: Non-conforming names break tooling and are a common vector for look-alike (impersonating) names.
    severity: low
    confidence: high
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Rename the skill using only `a-z`, `0-9` and single hyphens, at most 64 characters.
    references: ["https://agentskills.io/specification"]

  - id: AG-SKL-SPEC-003
    version: 1
    title: Skill name does not match its directory
    description: The spec requires `name` to match the parent directory name.
    why: A mismatch lets a skill present itself under a different name than the one reviewers see in the file tree.
    severity: low
    confidence: high
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Make the directory name and the frontmatter `name` identical.
    references: ["https://agentskills.io/specification"]

  - id: AG-SKL-SPEC-004
    version: 1
    title: Frontmatter field exceeds its length limit
    description: '`description` is limited to 1024 characters and `compatibility` to 500.'
    why: Oversized metadata is loaded into every session and is a common place to stuff hidden instructions.
    severity: low
    confidence: high
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Shorten the field; move detail into the SKILL.md body or references/.
    references: ["https://agentskills.io/specification"]

  - id: AG-SKL-SPEC-005
    version: 1
    title: Unexpected frontmatter key
    description: A frontmatter key is neither in the Agent Skills spec nor a known platform extension.
    why: Unknown keys are ignored by some agents and interpreted by others; they deserve a look.
    severity: info
    confidence: medium
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Remove the key or move it under `metadata` (string values only).
    references: ["https://agentskills.io/specification", "https://code.claude.com/docs/en/skills"]

  - id: AG-SKL-SPEC-006
    version: 1
    title: Markup or role tokens in frontmatter
    description: Frontmatter values contain angle-bracket markup, chat-template tokens or role labels.
    why: Frontmatter (especially `description`) is loaded into every session at startup, so markup there is an injection vector that reaches the agent before the skill is even used.
    severity: medium
    confidence: medium
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Use plain text in frontmatter values.

  - id: AG-SKL-SPEC-007
    version: 1
    title: Frontmatter anomaly
    description: Duplicate keys, YAML anchors/aliases or custom tags, non-string `metadata` values, a byte-order mark, or unterminated frontmatter.
    why: Duplicate keys and aliases let the value an agent loads differ from the value a reviewer reads.
    severity: medium
    confidence: high
    applies_to: [skill_md]
    match: {type: analyzer, analyzer: skill.spec}
    remediation: Use plain YAML with unique keys, no anchors/aliases/tags, and string metadata values.
