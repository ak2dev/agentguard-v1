# Social-engineering install steps ("Prerequisites" lures, ClickFix, etc.).
rules:
  - id: AG-SKL-SE-001
    version: 1
    title: Instructions to download and run a binary
    description: Setup text downloads an executable (or script) and runs it.
    why: '"Prerequisites" that download and run a binary are the most common delivery step in malicious-skill campaigns.'
    severity: high
    confidence: medium
    applies_to: [skill_md, instruction_md, reference, script]
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:curl|wget|iwr|Invoke-WebRequest|certutil(?:\.exe)?\s+-urlcache)\b[^\n]{0,200}(?:\s-o\s|\s-O\s|--output|-OutFile|\s>\s*\S)[^\n]{0,200}(?:&&|;|\|\|)\s*(?:sudo\s+)?(?:chmod\s+\+x|\./|start\s|Start-Process|open\s|bash\s|sh\s|\.\\)
        - |-
          https?://[^\s)>\]"']+\.(?:exe|msi|dmg|pkg|appimage|scr|bat|cmd|vbs|jar|run)\b
      require:
        - |-
          \b(?:run|execute|launch|open|double[- ]click|install|chmod|start)\b
      window: 3
    remediation: Do not ask users or agents to download and run binaries. Depend on packages from official registries with pinned versions and verified signatures.

  - id: AG-SKL-SE-002
    version: 3
    title: Pipe-to-shell from a non-allowlisted host
    description: A remote script is piped straight into a shell (curl | sh, iwr | iex) or run by a Windows binary that executes remote code (mshta, regsvr32 /i, rundll32, msiexec /i), from a host that is not a known vendor installer.
    why: Pipe-to-shell executes whatever the server returns at that moment, with no integrity check and no review.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:curl|wget|fetch)\b[^\n|]{0,300}https?://[^\n|]*\|\s*(?:sudo\s+)?(?:-E\s+)?(?:ba|z|k|da)?sh\b
        - |-
          \b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^\n|]*\|\s*(?:iex|Invoke-Expression)\b
        - |-
          \b(?:iex|Invoke-Expression)\s*\(?\s*(?:\(\s*)?(?:New-Object\s+(?:System\.)?Net\.WebClient\)?\.DownloadString|iwr|irm|Invoke-WebRequest|Invoke-RestMethod)
        - |-
          \b(?:ba|z)?sh\s+(?:-c\s+)?["']?\$\(\s*(?:curl|wget)\b[^)]*https?://
        - |-
          \b(?:python3?|node|perl|ruby)\s+(?:-c\s+)?["']?(?:<\(|\$\()\s*(?:curl|wget)\b
        - |-
          \bsource\s+<\(\s*(?:curl|wget)\b
        # Windows binaries that fetch and run remote code (LOLBAS: Mshta, Regsvr32, Rundll32, Msiexec).
        - |-
          \bmshta(?:\.exe)?\s+["']?(?:https?|vbscript|javascript):
        - |-
          \bregsvr32(?:\.exe)?\b[^\n]*\s/i:\s*["']?https?://
        - |-
          \brundll32(?:\.exe)?\b[^\n]*(?:javascript:|\burl\.dll\b[^\n]*https?://|\bmshtml\b[^\n]*RunHTMLApplication)
        - |-
          \bmsiexec(?:\.exe)?\b[^\n]*\s/(?:i|package)\s+["']?https?://
      unless:
        - |-
          (?:https?://(?:[a-z0-9-]+\.)*(?:astral\.sh|rustup\.rs|sh\.rustup\.rs|get\.docker\.com|brew\.sh|deno\.land|deno\.com|bun\.sh|nodejs\.org|deb\.nodesource\.com|rpm\.nodesource\.com|get\.pnpm\.io|install\.python-poetry\.org|pyenv\.run|get\.sdkman\.io|ollama\.com|claude\.ai/install|get\.helm\.sh|starship\.rs|tailscale\.com/install|fly\.io/install|get\.volta\.sh|sh\.vector\.dev|install\.determinate\.systems|nixos\.org/nix/install|mise\.run|get\.jetify\.com|opencode\.ai/install|cursor\.com/install|cli\.sentry\.dev/install|hf\.co/cli/install\.sh)\b)|(?:https?://raw\.githubusercontent\.com/(?:Homebrew/install|nvm-sh/nvm|ohmyzsh/ohmyzsh|pyenv/pyenv-installer|render-oss/cli)/)
      window: 0
    remediation: Replace pipe-to-shell with a pinned package from an official registry, or download a versioned artifact and verify its checksum/signature before running it.

  - id: AG-SKL-SE-003
    version: 1
    title: Password-protected archive with the password in the text
    description: Instructions to extract an archive using a password given alongside it.
    why: Password-protected archives are used to get malware past scanners; publishing the password defeats any legitimate reason for it.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:archive|zip|rar|7z|extraction|unzip)\s+(?:password|passcode|pass|pwd)\s*(?:is|:|=)\s*[`"'*]*[^\s`"'*]{3,}
        - |-
          \b(?:password|passcode|pwd)\s*(?:is|:|=)\s*[`"'*]*[^\s`"'*]{3,}
        - |-
          \b7z\s+[xe]\b[^\n]*\s-p\S+|\bunzip\s+[^\n]*-P\s+\S+|\bunrar\s+[xe]\b[^\n]*-p\S+
      require:
        - |-
          \.(?:zip|7z|rar)\b|\barchive\b|\bextract\b|\bunzip\b|\bunrar\b|\b7z\b
      window: 3
    remediation: Remove password-protected archives. Distribute code as reviewable source or signed packages.

  - id: AG-SKL-SE-004
    version: 1
    title: '"Paste this into your terminal" (ClickFix-style) instruction'
    description: Tells the user to paste a command into a terminal, PowerShell or the Run dialog.
    why: ClickFix lures get users to run attacker commands themselves, bypassing the agent's approval flow entirely.
    severity: high
    confidence: medium
    applies_to: [skill_md, instruction_md, reference]
    match:
      type: regex
      scopes: [body, hidden, decoded]
      patterns:
        - |-
          \b(?:copy\s+(?:and|&)\s+)?paste\b[^\n]{0,80}\b(?:into|in)\s+(?:your\s+|a\s+|the\s+)?(?:terminal|shell|command\s+prompt|cmd|powershell|run\s+(?:dialog|box)|console)\b
        - |-
          \b(?:press|hit)\s+(?:Win(?:dows)?(?:\s+key)?\s*\+\s*R)\b
        - |-
          \bopen\s+(?:the\s+)?(?:Terminal|PowerShell|cmd|command\s+prompt)\s+(?:and|then)\s+paste\b
    remediation: Do not ask users to paste commands. Provide installable, pinned packages, or let the agent run commands through its approval flow.

  - id: AG-SKL-SE-005
    version: 2
    title: Encoded command execution
    description: A command decodes base64/base85/hex or compressed content and executes it (PowerShell -EncodedCommand, base64 -d | sh, FromBase64String | iex, eval(atob(...)), os.system/subprocess/exec on base64.b85decode, bytes.fromhex or zlib.decompress output, including XOR-wrapped decodes).
    why: Encoding the command hides what runs from the user and the reviewer; legitimate setup steps have no reason to do this.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:powershell|pwsh)(?:\.exe)?\b[^\n]*\s-(?:e|en|enc|enco|encod|encode|encoded|encodedcommand|ec)\s+[A-Za-z0-9+/=]{16,}
        - |-
          \bbase64\s+(?:-d|--decode|-D)\b[^\n]*\|\s*(?:sudo\s+)?(?:ba|z|da|k)?sh\b
        - |-
          \becho\s+["']?[A-Za-z0-9+/=]{16,}["']?\s*\|\s*base64\s+(?:-d|--decode|-D)\s*(?:\|\s*(?:ba|z)?sh|>\s*\S+\s*(?:&&|;)\s*(?:chmod|bash|sh|\./))
        - |-
          \bxxd\s+-r\s+-p\b[^\n]*\|\s*(?:ba|z)?sh\b
        - |-
          FromBase64String[^\n]*\|\s*(?:iex|Invoke-Expression)|(?:iex|Invoke-Expression)[^\n]*FromBase64String
        - |-
          \b(?:exec|eval)\s*\(\s*(?:base64\.b64decode|codecs\.decode|bytes\.fromhex|zlib\.decompress|__import__\(\s*["']base64)
        - |-
          \beval\s*\(\s*(?:atob|Buffer\.from)\s*\(
        # Process/exec sinks fed by a decoder on the same line, e.g. os.system(bytes(b ^ k for b in base64.b85decode(d)).decode())
        # (scanner-bypass obfuscation reported by Trail of Bits and CSA, June 2026).
        - |-
          \b(?:os\.(?:system|popen|exec[lv]p?e?)|subprocess\.(?:run|call|Popen|check_output|check_call|getoutput|getstatusoutput)|exec|eval)\s*\([^\n]{0,200}?\b(?:base64\.(?:b64|b32|b16|b85|a85|urlsafe_b64|standard_b64)decode|codecs\.decode|bytes\.fromhex|binascii\.(?:a2b_base64|unhexlify)|(?:zlib|gzip|bz2|lzma)\.decompress|marshal\.loads)\s*\(
    remediation: Remove encoded execution. If a command is needed, write it in plain text so users and reviewers can read it.

  - id: AG-SKL-SE-006
    version: 1
    title: Fake credential prompt
    description: Asks the user (via the agent or a fake dialog) for their system password, keychain password, seed phrase or private key.
    why: Credential-harvesting prompts are a standard infostealer technique delivered through skills.
    severity: high
    confidence: medium
    applies_to: [skill_md, instruction_md, reference, script]
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:ask|prompt|request)\s+(?:the\s+)?user\s+(?:for|to\s+(?:enter|provide|type|paste))\s+(?:their|his|her|the|your)\s+(?:(?:system|admin|administrator|sudo|login|keychain|macos|mac|root|windows|account)\s+)?(?:password|passphrase|seed\s+phrase|recovery\s+phrase|mnemonic|private\s+key)\b
        - |-
          \becho\s+["']?\$?\{?\w*(?:pass|PASS|pwd|PWD)\w*\}?["']?\s*\|\s*sudo\s+-S\b
        - |-
          \bosascript\b[^\n]*display\s+dialog[^\n]*(?:password|hidden\s+answer)
        - |-
          \b(?:enter|paste|type|provide|send|share)\s+(?:your\s+)?(?:wallet\s+)?(?:seed|recovery|mnemonic)\s+(?:phrase|words)\b
    remediation: Never collect passwords, seed phrases or private keys. Use the platform's credential store or OAuth.

  - id: AG-SKL-SE-007
    version: 2
    title: OS protection bypass
    description: Removes macOS quarantine, disables Gatekeeper/SIP, adds Microsoft Defender exclusions or disables real-time protection. Removing quarantine from a binary under a package manager's prefix (`$(brew --prefix)`, /opt/homebrew, /usr/local/Cellar, linuxbrew) is reported at MEDIUM instead of CRITICAL.
    why: Disabling OS protections is a hallmark of malware installers, not of agent skills. Clearing quarantine on a package-manager-installed binary (a vendor tap shipping an unnotarized CLI) still skips Gatekeeper, so it is reported, but it is not the download-and-unquarantine lure that CRITICAL is reserved for; the trust decision there is the tap itself.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \bxattr\s+(?:-[a-z]*d[a-z]*\s+)?(?:-r\s+)?com\.apple\.quarantine\b|\bxattr\s+-[a-z]*c[a-z]*r?\s+\S
        - |-
          \bspctl\s+--(?:master|global)-disable\b|\bcsrutil\s+disable\b
        - |-
          \bdefaults\s+write\s+com\.apple\.LaunchServices\s+LSQuarantine\s+-bool\s+(?:NO|false)\b
        - |-
          \bAdd-MpPreference\b[^\n]*-Exclusion(?:Path|Process|Extension|IpAddress)\b
        - |-
          \bSet-MpPreference\b[^\n]*-Disable(?:RealtimeMonitoring|IOAVProtection|BehaviorMonitoring|ScriptScanning)\s+\$?(?:true|1)\b
      window: 0
      downgrade:
        - severity: medium
          patterns:
            - |-
              \bxattr\s+(?:-[a-z]+\s+)*(?:com\.apple\.quarantine\s+)?["']?(?:\$\(brew\s+--prefix[^)\n]*\)|/opt/homebrew/|/usr/local/(?:Cellar|Caskroom|opt)/|/home/linuxbrew/\.linuxbrew/)
    remediation: Remove steps that weaken OS protections. Distribute signed, notarized software instead.

  - id: AG-SKL-SE-008
    version: 2
    title: Pipe-to-shell from an allowlisted vendor installer
    description: A vendor's official installer script is piped into a shell.
    why: Common and usually legitimate, but it still executes unpinned remote code with no integrity check. Reported for visibility.
    severity: low
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:curl|wget|fetch)\b[^\n|]{0,300}https?://[^\n|]*\|\s*(?:sudo\s+)?(?:-E\s+)?(?:ba|z|k|da)?sh\b
        - |-
          \b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^\n|]*\|\s*(?:iex|Invoke-Expression)\b
      require:
        - |-
          (?:https?://(?:[a-z0-9-]+\.)*(?:astral\.sh|rustup\.rs|sh\.rustup\.rs|get\.docker\.com|brew\.sh|deno\.land|deno\.com|bun\.sh|nodejs\.org|deb\.nodesource\.com|rpm\.nodesource\.com|get\.pnpm\.io|install\.python-poetry\.org|pyenv\.run|get\.sdkman\.io|ollama\.com|claude\.ai/install|get\.helm\.sh|starship\.rs|tailscale\.com/install|fly\.io/install|get\.volta\.sh|sh\.vector\.dev|install\.determinate\.systems|nixos\.org/nix/install|mise\.run|get\.jetify\.com|opencode\.ai/install|cursor\.com/install|cli\.sentry\.dev/install|hf\.co/cli/install\.sh)\b)|(?:https?://raw\.githubusercontent\.com/(?:Homebrew/install|nvm-sh/nvm|ohmyzsh/ohmyzsh|pyenv/pyenv-installer|render-oss/cli)/)
      window: 0
    remediation: Prefer a package manager with pinned versions, or verify the installer checksum before running it.

  - id: AG-SKL-SE-009
    version: 1
    title: Download-and-run instruction in plain words
    description: Prose tells the reader to fetch something from a remote host and run it through a shell, terminal or console, make it executable, paste it, or approve security warnings — the same lure as a curl | sh step, written without command syntax.
    why: Malicious skills rephrase their "Prerequisites" step to slip past scanners that only recognize commands. The instruction is just as dangerous when a person or an agent follows the words.
    severity: high
    confidence: medium
    applies_to: [skill_md, instruction_md, reference]
    match:
      type: regex
      scopes: [body, hidden, decoded]
      patterns:
        - |-
          \b(?:download|grab|fetch|pull(?:\s+down)?|get|retrieve|obtain|save|copy)\b[^\n]{0,80}?(?:https?://[^\s)>\]"'`]+|\b(?:[a-z0-9-]+\.){2,}[a-z]{2,24}\b(?:/[^\s)>\]"'`]*)?|\b[a-z0-9-]+\.[a-z]{2,24}/[^\s)>\]"'`]+)
      require:
        # ...and runs *it* (not some other command on the same line)...
        - |-
          \b(?:run|execute|launch|start|open|double[- ]click)\s+(?:it|them|this|that|the\s+(?:file|script|binary|installer|helper|tool|runner|program|app|setup|bootstrap|package|command|line))\b|\b(?:hand|pipe|feed|pass)\s+(?:it|them|this|that|the\s+\w+)\s+(?:straight\s+|directly\s+)?(?:to|into)\b|\bpaste\b|\b(?:make|mark)\s+(?:it|them|the\s+\w+)\s+(?:as\s+)?executable\b|\bchmod\b
        # ...in a way that hands it code execution or skips a warning.
        - |-
          \b(?:shell|terminal|console|interpreter|command[- ]?(?:line|prompt)|bash|zsh|sh|powershell|pwsh|cmd|run\s+(?:dialog|box)|executable|chmod|warnings?|gatekeeper|smartscreen|defender|antivirus)\b|\bwin\s*\+\s*r\b|\bpress\s+enter\b
      unless:
        - |-
          \b(?:never|don't|do\s+not|avoid|beware|phishing|scams?|malicious|attackers?|lures?|such\s+as|for\s+example|e\.g\.|detects?|flag(?:s|ged)?)\b
      window: 0
      downgrade:
        - {severity: medium, roles: [reference], quoted: true}
    remediation: Remove the step. Depend on packages from official registries with pinned versions, or document a versioned artifact with a checksum the user verifies before running it.

  - id: AG-SKL-SE-010
    version: 1
    title: Downloaded file is executed, possibly from another file
    description: A file is downloaded to a path and that path is then run or made executable — in the same file, or in another script or code block of the same skill (a download-and-execute split across files).
    why: Splitting the download and the execution across scripts hides a staged payload from reviewers and from rules that look at one line or one file. Running a downloaded file executes whatever the host serves at that moment.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: analyzer
      analyzer: skill.staged
      params:
        # Same vendor installers as AG-SKL-SE-002/008: reported at LOW.
        allow_hosts: |-
          (?:https?://(?:[a-z0-9-]+\.)*(?:astral\.sh|rustup\.rs|sh\.rustup\.rs|get\.docker\.com|brew\.sh|deno\.land|deno\.com|bun\.sh|nodejs\.org|deb\.nodesource\.com|rpm\.nodesource\.com|get\.pnpm\.io|install\.python-poetry\.org|pyenv\.run|get\.sdkman\.io|ollama\.com|claude\.ai/install|get\.helm\.sh|starship\.rs|tailscale\.com/install|fly\.io/install|get\.volta\.sh|sh\.vector\.dev|install\.determinate\.systems|nixos\.org/nix/install|mise\.run|get\.jetify\.com|opencode\.ai/install|cursor\.com/install|cli\.sentry\.dev/install|hf\.co/cli/install\.sh)\b)|(?:https?://raw\.githubusercontent\.com/(?:Homebrew/install|nvm-sh/nvm|ohmyzsh/ohmyzsh|pyenv/pyenv-installer|render-oss/cli)/)
    remediation: Do not download and run code from a skill. Depend on a pinned package from an official registry, or ship the code in the skill where it can be reviewed. If a download is unavoidable, pin a versioned URL and verify its checksum or signature before running it.

  - id: AG-SKL-SE-011
    version: 1
    title: Reverse shell
    description: A command or script connects out to a remote host and attaches a shell to the connection (bash /dev/tcp, nc -e, mkfifo | sh | nc, socat exec, socket + dup2 + shell, PowerShell TCPClient + iex).
    why: A reverse shell hands an attacker interactive control of the machine, bypassing inbound firewalls. No legitimate skill needs one.
    severity: critical
    confidence: high
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          [<>]&\s*/dev/(?:tcp|udp)/[\w.-]+/\d{1,5}\b|\bexec\s+\d+<>\s*/dev/(?:tcp|udp)/[\w.-]+/\d{1,5}\b|/dev/(?:tcp|udp)/[\w.-]+/\d{1,5}\b[^\n]{0,20}(?:0>&1|<&\s*\d|>&\s*\d)
        - |-
          \b(?:nc|ncat|netcat)(?:\.exe)?\b[^\n]{0,80}\s-(?:e|c)\s+["']?(?:/bin/|/usr/bin/)?(?:(?:ba|z|k|da)?sh|cmd(?:\.exe)?|powershell(?:\.exe)?)\b
        - |-
          \bmkfifo\b[^\n]{0,80}\|\s*(?:/bin/)?(?:ba|z|da)?sh\s+-i\b[^\n]{0,80}\|\s*(?:nc|ncat|netcat|openssl\s+s_client|telnet)\b
        - |-
          \bsocat\b[^\n]*\b(?:exec|system):[^\n]*\b(?:tcp|ssl|openssl)[46]?(?:-connect)?:|\bsocat\b[^\n]*\b(?:tcp|ssl|openssl)[46]?(?:-connect)?:[^\n]*\b(?:exec|system):
        - |-
          \bos\.dup2\s*\(\s*\w+\.fileno\(\)
        - |-
          \bperl\b[^\n]*\buse\s+Socket\b[^\n]*\bexec\b
        - |-
          \bNew-Object\s+(?:System\.)?Net\.Sockets\.TCPClient\s*\([^\n]*(?:\biex\b|Invoke-Expression)
      require:
        # Python/Ruby socket forms: the connection and the shell are in the same few lines.
        - |-
          /dev/(?:tcp|udp)/|\b(?:nc|ncat|netcat|socat|perl|TCPClient)\b|\.connect\s*\([^\n]*\)[\s\S]{0,400}?(?:pty\.spawn|subprocess\.(?:call|Popen|run)\s*\(\s*\[?\s*["'](?:/bin/)?(?:ba|z)?sh|os\.exec\w*\s*\(\s*["'](?:/bin/)?(?:ba|z)?sh)|(?:pty\.spawn|subprocess\.(?:call|Popen|run)\s*\(\s*\[?\s*["'](?:/bin/)?(?:ba|z)?sh)[\s\S]{0,400}?\.connect\s*\(
      unless:
        - |-
          \b(?:detects?|detection|flag(?:s|ged)?|alert|block(?:s|ed)?|example|such as|e\.g\.|for instance|cheat ?sheet|signatures?|patterns?|red[- ]?team|ctf)\b
      window: 6
      downgrade:
        - {severity: medium, roles: [reference], quoted: true}
    remediation: Remove the reverse shell. If the skill needs remote access, document an authenticated, user-initiated mechanism instead.

  - id: AG-SKL-SE-012
    version: 1
    title: Package manager registry redirected to an unofficial host
    description: A command, script or config snippet points npm, yarn, pnpm, pip, uv, Go or RubyGems at a registry other than the official one (npm/yarn config set registry, registry= written to .npmrc/.yarnrc, npmRegistryServer, pip config set global.index-url, --index-url/--extra-index-url, PIP_/UV_ index variables, GOPROXY, gem sources --add).
    why: Every later install on the machine then resolves packages through a host the skill author chose, which can serve modified packages long after the skill is removed. The change is easy to dress up as a "corporate mirror" (the Trail of Bits dev-env-setup bypass, June 2026).
    severity: high
    confidence: medium
    applies_to: [skill_md, instruction_md, reference, script]
    aivss: {threat: attacked}
    match:
      type: regex
      scopes: [body, hidden, decoded, command, code]
      patterns:
        - |-
          \b(?:npm|pnpm|yarn)\s+config\s+set\s+["']?(?:@[\w.-]+:)?registry["']?(?:\s*=\s*|\s+)["']?https?://
        - |-
          \bregistry\s*=\s*["']?https?://[^\s"']+["']?[^\n]{0,60}?>>?\s*["']?[^\s"']*\.npmrc\b
        - |-
          \bregistry\s+["']?https?://[^\s"']+["']?[^\n]{0,60}?>>?\s*["']?[^\s"']*\.yarnrc\b
        - |-
          \bnpmRegistryServer\s*:\s*["']?https?://
        - |-
          \bpip3?\s+config\s+set\s+(?:global|user|site)\.(?:extra-)?index-url\s+["']?https?://
        - |-
          (?:\bpip3?\s+install|\buv\s+pip\s+install|\buv\s+(?:add|sync))\b[^\n]*\s--(?:extra-)?index-url[=\s]+["']?https?://
        - |-
          \b(?:PIP_(?:EXTRA_)?INDEX_URL|UV_(?:EXTRA_)?INDEX_URL|UV_DEFAULT_INDEX|UV_INDEX)\s*=\s*["']?https?://
        - |-
          (?m)^\s*(?:extra-)?index-url\s*=\s*https?://
        - |-
          \bGOPROXY\s*=\s*["']?https?://
        - |-
          \bgem\s+sources\s+(?:--add|-a)\s+["']?https?://
      unless:
        # Official registries, the PyTorch/NVIDIA wheel indexes (the documented way to install CUDA builds) and local test registries.
        - |-
          https?://(?:registry\.npmjs\.org|registry\.yarnpkg\.com|pypi\.org|pypi\.python\.org|files\.pythonhosted\.org|download\.pytorch\.org|pypi\.nvidia\.com|proxy\.golang\.org|rubygems\.org|localhost|127\.0\.0\.1|\[::1\])(?:[:/"'\s]|$)
      window: 0
    remediation: Do not change package-manager configuration from a skill. If a private registry is genuinely required, document it for the user to configure themselves, scope it to one package namespace (npm "@scope:registry"), and never ship a script that writes ~/.npmrc, ~/.yarnrc or pip.conf.
