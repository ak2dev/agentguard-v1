name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked, with the optional native analyzers)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.23"
          # yara-python 4.5.4 publishes wheels up to CPython 3.13.
          extras="--extra code"
          if [ "${{ matrix.python }}" != "3.14" ]; then extras="$extras --extra yara"; fi
          uv sync --frozen --group dev $extras
      - name: Unit, rule-fixture and safety tests
        env:
          # Fixtures for these analyzers must run here, not be skipped.
          AG_REQUIRE_NATIVE: ${{ matrix.python == '3.14' && 'code.ts' || 'code.ts,yara' }}
        run: uv run pytest -q
      - name: Every rule has positive and negative fixtures; crosswalk has no orphans
        run: uv run python scripts/check_pack.py

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.23" && uv sync --frozen --group dev
      - name: Regenerate schemas and site data
        run: uv run python scripts/gen_site_data.py
      - name: Fail if anything changed
        run: git diff --exit-code -- schemas site/src/data/generated

  bench:
    name: Benchmark (targets + regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.23" && uv sync --frozen --group dev
      - run: uv run agentguard bench --output bench-results.json
      - name: Results of the target branch (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:bench/results/latest.json > bench-base.json || rm -f bench-base.json
      - name: Targets met, committed results fresh, no regression against the target branch
        run: uv run python scripts/check_bench.py bench-results.json bench/results/latest.json bench-base.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-results.json

  pyodide:
    name: Core rule engine under Pyodide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install pinned Pyodide
        working-directory: tests/pyodide
        run: npm ci --no-audit --no-fund
      - name: Run fixtures in Pyodide
        working-directory: tests/pyodide
        run: node run_core.mjs ../..

  web-server:
    name: Agent Guard Web server (API, resolver, isolated sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.23" && uv sync --frozen --all-packages --all-groups
      - name: API, pipeline, resolver and fetcher tests (no network, no Docker)
        working-directory: web
        run: uv run --frozen pytest
      - name: Build the scanner sandbox image
        run: docker build -f web/docker/scanner.Dockerfile -t agentguard-scanner:local .
      - name: Isolation tests against real containers (no egress, limits, cleanup, determinism)
        working-directory: web
        env:
          AGW_DOCKER_TESTS: "1"
        run: uv run --frozen pytest tests/test_docker_sandbox.py
      - name: The API/dispatcher image builds
        run: docker build -f web/docker/server.Dockerfile -t agentguard-web:local .

  browser-scanner:
    name: Browser scanner end-to-end (zero-network paste and drop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build the site with the scanner enabled
        working-directory: site
        env:
          PUBLIC_FEATURE_SCAN: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: End-to-end tests (installed Chrome, production headers from vercel.json)
        working-directory: site
        run: npx playwright test

  dogfood:
    name: Agent Guard scans itself (SARIF on PRs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          path: .
          fail-on: high
