name: Website

# Builds the site exactly as Vercel does (vercel.json) and runs the generated-data
# and CSP / inline-script / SRI gates. Deployment is Vercel's Git integration,
# configured by vercel.json; this workflow never deploys.

on:
  push:
    branches: [main]
    paths: ["site/**", "rules/**", "mappings/**", "bench/results/**", "src/agentguard/**", "scripts/gen_site_data.py", "vercel.json"]
  pull_request:
    paths: ["site/**", "rules/**", "mappings/**", "bench/results/**", "src/agentguard/**", "scripts/gen_site_data.py", "vercel.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Generated site data is up to date
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.19" && uv sync --frozen --group dev
          uv run python scripts/gen_site_data.py
          git diff --exit-code -- site/src/data/generated schemas
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Build as deployed (includes the CSP / inline-script / SRI gate)
        working-directory: site
        env:
          PUBLIC_FEATURE_SCAN: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
