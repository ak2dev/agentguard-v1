name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "rules/**", "mappings/**", "bench/results/**", "src/agentguard/cli/**", "scripts/gen_site_data.py"]
  pull_request:
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Generated site data is up to date
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.19" && uv sync --group dev
          uv run python scripts/gen_site_data.py
          git diff --exit-code -- site/src/data/generated schemas
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Build (includes the CSP / inline-script / SRI gate)
        working-directory: site
        env:
          AG_SITE_BASE: /${{ github.event.repository.name }}
          AG_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
