name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.23"
      - name: Test before release
        run: uv sync --frozen --group dev && uv run pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: SBOM (CycloneDX) for the release
        run: uvx --from "cyclonedx-bom==7.1.0" cyclonedx-py environment --output-format JSON --output-file dist/agentguard.cdx.json .venv
      - name: Rule pack bundle
        run: |
          tar --sort=name --mtime='2026-01-01' --owner=0 --group=0 --numeric-owner -czf dist/agentguard-rulepack.tgz rules mappings
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write      # Sigstore keyless signing + PyPI trusted publishing
      contents: write      # attach signed artifacts to the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/agentguard.cdx.json ./dist/agentguard-rulepack.tgz ./dist/SHA256SUMS
          release-signing-artifacts: true
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
