name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.19"
      - name: Test before release
        run: uv sync --frozen --group dev && uv run pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: SBOM (CycloneDX) for the release
        run: uvx --from "cyclonedx-bom==7.1.0" cyclonedx-py environment --output-format JSON --output-file dist/agentguard.cdx.json .venv
      - name: Rule pack bundle
        run: |
          tar --sort=name --mtime='2026-01-01' --owner=0 --group=0 --numeric-owner -czf dist/agentguard-rulepack.tgz rules mappings
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write      # Sigstore keyless signing + PyPI trusted publishing
      contents: write      # attach signed artifacts to the GitHub release
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/agentguard.cdx.json ./dist/agentguard-rulepack.tgz ./dist/SHA256SUMS
          release-signing-artifacts: true
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
