# Real-world benign benchmark sources, pinned by commit and tarball hash.
# Fetch with `python bench/fetch_real.py` (dev-only, network), then
# `python bench/generate_synthetic.py` to merge them into manifest.yaml.
#
# Licensing: only permissively licensed directories are vendored, each with
# its own license file (checked by fetch_real.py); attributions are in
# bench/NOTICE. Deliberately NOT vendored:
#   anthropics/skills  docx, pdf, pptx, xlsx  proprietary ("source-available")
#   anthropics/skills  doc-coauthoring        no license file
#   anthropics/skills  canvas-design          5.4 MB, mostly bundled third-party fonts
#   openai/skills      figma*                 Figma Developer Terms (proprietary)
#   openai/skills      cloudflare-deploy      1.3 MB of vendored docs (size)
#
# Splits: `dev` sources were looked at while tuning rules. Round 1 tuned on
# anthropics/skills; openai/skills, modelcontextprotocol/servers and
# microsoft/playwright-mcp were held out, measured once, then tuned on in
# round 2; huggingface/skills and supabase-mcp were the round-2 held-out set,
# measured once, then tuned on in round 3. `heldout` sources (microsoft/skills,
# cloudflare/mcp-server-cloudflare) were added after all tuning and scanned
# once; no rule was changed in response to them. See docs/benchmark.md.
