# Agent Guard Web for local development:  docker compose up --build
# API on http://127.0.0.1:8000 · see web/README.md.
#
# The dispatcher talks to the Docker daemon to start one isolated scanner
# container per job (no network, read-only, non-root). Mounting the Docker
# socket gives the dispatcher control of the local daemon: fine for local
# development; in production run scans on a dedicated host or VM (ideally with
# gVisor, AGW_DOCKER_RUNTIME=runsc) as described in web/README.md.
name: agentguard-web

x-agw-env: &agw-env
  AGW_MODE: prod
  AGW_STORE: postgresql://agw:agw-dev-only@postgres:5432/agw
  AGW_QUEUE: redis://redis:6379/0
  AGW_SANDBOX: docker
  AGW_SCANNER_IMAGE: agentguard-scanner:local
  AGW_ALLOWED_ORIGINS: http://127.0.0.1:4321,http://localhost:4321,http://127.0.0.1:4322,http://localhost:4322
  AGW_RATE_SALT: local-dev-salt

services:
  scanner:
    # Built for the dispatcher to run per job; as a service it just exits.
    build: { context: ., dockerfile: web/docker/scanner.Dockerfile }
    image: agentguard-scanner:local
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: [/data]

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: agw
      POSTGRES_PASSWORD: agw-dev-only
      POSTGRES_DB: agw
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agw"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: web/docker/server.Dockerfile }
    image: agentguard-web:local
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    environment: *agw-env
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  dispatcher:
    image: agentguard-web:local
    command: ["dispatcher"]
    environment: *agw-env
    user: root   # to use the Docker socket in local development
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api: { condition: service_started }
      scanner: { condition: service_completed_successfully }

volumes:
  pgdata: {}
